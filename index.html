<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlipX — Two Board Test</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10151f;
      color: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.25rem;
      background: #10151f;
    }

    main {
      width: min(74rem, 100%);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2rem);
      border: 1px solid #35445a;
      border-radius: 1rem;
      background: #192230;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.75rem, 6vw, 2.4rem);
    }

    .subtitle {
      margin: 0 0 1.25rem;
      color: #aebed1;
    }

    button {
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.55rem;
      cursor: pointer;
      background: #4c8dff;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #75a7ff;
    }

    button:focus-visible {
      outline: 3px solid #79d9ba;
      outline-offset: 3px;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0;
      color: #aebed1;
    }

    /*
      The board cards display in a row where possible, and wrap
      vertically on narrower screens.
    */
    #boards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(1.25rem, 4vw, 3rem);
      margin-top: 1.5rem;
    }

    .board-card {
      flex: 1 1 28rem;
      max-width: 34rem;
      padding: 1.25rem;
      border: 1px solid #40516a;
      border-radius: 0.9rem;
      background: #111924;
    }

    .board-title {
      margin: 0;
      text-align: center;
      color: #79d9ba;
      font-size: 1.2rem;
    }

    .board-wrap {
      display: grid;
      place-items: center;
      margin: 1.1rem 0 1.3rem;
      overflow-x: auto;
      padding: 0.25rem;
    }

    /*
      Coordinates 0–6 allow optional source letters to extend beyond
      the central 5×5 FlipX lattice. Only actual letter tiles are added.
    */
    .board {
      --tile-size: clamp(1.9rem, 7vw, 3.35rem);
      display: grid;
      grid-template-columns: repeat(7, var(--tile-size));
      grid-template-rows: repeat(7, var(--tile-size));
      gap: 3px;
    }

   .tile {
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid #4e627e;
  border-radius: 0.35rem;
  cursor: default;
  font: inherit;
  font-size: clamp(0.95rem, 4vw, 1.45rem);
  font-weight: 800;
  line-height: 1;
  text-transform: uppercase;
  user-select: none;
}

.tile--a {
  background: #d9e9ff;
  color: #10243d;
  border-color: #6488b6;
}

.tile--b {
  background: #ffe7ad;
  color: #3c2806;
  border-color: #b58936;
}

    .debug-heading {
      margin: 0 0 0.65rem;
      color: #aebed1;
      font-size: 0.95rem;
    }

    .puzzle-debug {
      display: grid;
      gap: 0.5rem;
      margin: 0;
      padding: 0.9rem;
      border-radius: 0.7rem;
      background: #0b1119;
      font: 600 1rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .entry {
      display: grid;
      grid-template-columns: 2.75rem 1fr;
      gap: 0.75rem;
    }

    .label {
      color: #79d9ba;
    }

    @media (max-width: 38rem) {
      body {
        padding: 0.7rem;
      }

      main {
        padding: 1rem;
      }

      .board-card {
        flex-basis: 100%;
        padding: 0.9rem;
      }

      .board {
        --tile-size: clamp(1.55rem, 10vw, 2.5rem);
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>FlipX</h1>
    <p class="subtitle">Two-board renderer test</p>

    <button id="new-puzzle" type="button">Load two new puzzles</button>

    <p id="status" role="status">Loading puzzles…</p>

    <section id="boards" aria-label="Two FlipX puzzle boards">
      <article class="board-card">
        <h2 class="board-title">Grid A</h2>

        <div class="board-wrap">
          <div
            id="board-a"
            class="board"
            role="grid"
            aria-label="Grid A crossword board"
          ></div>
        </div>

        <h3 class="debug-heading">Source slots — temporary debug view</h3>
        <div id="puzzle-a" class="puzzle-debug" aria-live="polite"></div>
      </article>

      <article class="board-card">
        <h2 class="board-title">Grid B</h2>

        <div class="board-wrap">
          <div
            id="board-b"
            class="board"
            role="grid"
            aria-label="Grid B crossword board"
          ></div>
        </div>

        <h3 class="debug-heading">Source slots — temporary debug view</h3>
        <div id="puzzle-b" class="puzzle-debug" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
