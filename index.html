<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlipX — Puzzle Loader</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10151f;
      color: #f4f7fb;
    }

    main {
      width: min(42rem, calc(100% - 2rem));
      padding: 2rem;
      border: 1px solid #35445a;
      border-radius: 1rem;
      background: #192230;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: #aebed1;
    }

    button {
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.55rem;
      cursor: pointer;
      background: #4c8dff;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #75a7ff;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0;
      color: #aebed1;
    }

    #puzzle {
      display: grid;
      gap: 0.65rem;
      margin: 0;
      padding: 1rem;
      border-radius: 0.7rem;
      background: #0f151e;
      font: 600 1.1rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .entry {
      display: grid;
      grid-template-columns: 3rem 1fr;
      gap: 0.75rem;
    }

    .label {
      color: #79d9ba;
    }
  </style>
</head>

<body>
  <main>
    <h1>FlipX</h1>
    <p class="subtitle">Verified puzzle-bank loader</p>

    <button id="new-puzzle" type="button">Load another puzzle</button>

    <p id="status" role="status">Loading puzzles…</p>

    <div id="puzzle" aria-live="polite"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
