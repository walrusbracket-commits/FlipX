<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlipX</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10151f;
      color: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.25rem;
      background: #10151f;
    }

    main {
      width: min(74rem, 100%);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2rem);
      border: 1px solid #35445a;
      border-radius: 1rem;
      background: #192230;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.75rem, 6vw, 2.4rem);
    }

    .subtitle {
      margin: 0 0 1.25rem;
      color: #aebed1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.9rem;
    }

    button {
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.55rem;
      cursor: pointer;
      background: #4c8dff;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #75a7ff;
    }

    button:focus-visible {
      outline: 3px solid #79d9ba;
      outline-offset: 3px;
    }

    #new-puzzle.is-ready {
      background: #54bc91;
      color: #092117;
    }

    #move-count {
      margin: 0;
      padding: 0.55rem 0.75rem;
      border: 1px solid #40516a;
      border-radius: 0.55rem;
      background: #111924;
      color: #dce9f8;
      font-weight: 700;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0 0;
      color: #aebed1;
    }

    /*
      The win banner is part of normal page flow, not a modal.
      It never covers the completed boards.
    */
    #celebration {
      display: none;
      margin: 1rem 0 0;
      padding: 1rem 1.15rem;
      border: 1px solid #5ad2a9;
      border-radius: 0.75rem;
      background: #14372c;
      color: #e4fff4;
      text-align: center;
    }

    #celebration.is-visible {
      display: block;
      animation: celebration-in 260ms ease-out both;
    }

    #celebration h2 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
    }

    #celebration p {
      margin: 0.4rem 0 0;
      color: #c8f7e4;
    }

    #share-panel {
  display: none;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid rgb(200 247 228 / 28%);
}

#share-panel.is-visible {
  display: block;
}

#share-panel h3 {
  margin: 0;
  font-size: 1rem;
}

#share-panel p {
  margin: 0.35rem 0 0.75rem;
}

#share-text {
  display: block;
  width: 100%;
  min-height: 6.5rem;
  margin: 0;
  padding: 0.7rem;
  border: 1px solid #70c9a8;
  border-radius: 0.5rem;
  resize: vertical;
  background: #0b2119;
  color: #e4fff4;
  font: 600 0.9rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.share-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.7rem;
  margin-top: 0.75rem;
}

.share-actions button {
  background: #54bc91;
  color: #092117;
}

.share-actions button:hover {
  background: #79ddb3;
}

#copy-status {
  min-height: 1.25rem;
  margin: 0.65rem 0 0;
  color: #c8f7e4;
  font-size: 0.9rem;
}
    #boards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(1.25rem, 4vw, 3rem);
      margin-top: 1.5rem;
    }

    .board-card {
      flex: 1 1 28rem;
      max-width: 34rem;
      padding: 1.25rem;
      border: 1px solid #40516a;
      border-radius: 0.9rem;
      background: #111924;
    }

    .board-title {
      margin: 0;
      text-align: center;
      color: #dce9f8;
      font-size: 1.2rem;
    }

    .board-wrap {
      display: grid;
      place-items: center;
      margin: 1.1rem 0 0.25rem;
      overflow-x: auto;
      padding: 0.25rem;
    }

    .board {
      --tile-size: clamp(1.9rem, 7vw, 3.35rem);
      display: grid;
      grid-template-columns: repeat(7, var(--tile-size));
      grid-template-rows: repeat(7, var(--tile-size));
      gap: 3px;
    }

    /*
      Every tile now looks the same. The player cannot identify an
      intruding tile from its colour; only the word structure helps.
    */
    .tile {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid #73849a;
      border-radius: 0.35rem;
      background: #edf2f7;
      color: #172130;
      cursor: pointer;
      font: inherit;
      font-size: clamp(0.95rem, 4vw, 1.45rem);
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
      touch-action: manipulation;
    }

    .tile:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .tile:active {
      transform: translateY(1px) scale(0.97);
    }

    .tile:focus-visible {
      outline: 3px solid #79d9ba;
      outline-offset: 3px;
    }

    .tile.is-flying-origin {
      opacity: 0;
      pointer-events: none;
    }

    #animation-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .flying-tile {
      position: fixed;
      z-index: 21;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0;
      border: 1px solid #73849a;
      border-radius: 0.35rem;
      background: #edf2f7;
      color: #172130;
      font: inherit;
      font-size: clamp(0.95rem, 4vw, 1.45rem);
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
      will-change: transform;
      box-shadow: 0 0.45rem 1.1rem rgb(0 0 0 / 34%);
    }

    .flying-tile--front {
      z-index: 22;
    }

    @keyframes celebration-in {
      from {
        opacity: 0;
        transform: translateY(-0.45rem);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ready-pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgb(84 188 145 / 0%);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 0 0.5rem rgb(84 188 145 / 26%);
        transform: scale(1.04);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      #new-puzzle.is-ready {
        animation: ready-pulse 1.25s ease-in-out infinite;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .tile,
      #celebration.is-visible {
        transition: none;
        animation: none;
      }
    }

    @media (max-width: 38rem) {
      body {
        padding: 0.7rem;
      }

      main {
        padding: 1rem;
      }

      .board-card {
        flex-basis: 100%;
        padding: 0.9rem;
      }

      .board {
        --tile-size: clamp(1.55rem, 10vw, 2.5rem);
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>FlipX</h1>
    <p class="subtitle">Make both grids into valid words.</p>

    <div class="controls">
      <button id="new-puzzle" type="button">New puzzle</button>
      <p id="move-count" aria-live="polite">Tiles moved: 0</p>
    </div>

    <p id="status" role="status">Loading puzzle data…</p>

    <section id="celebration" aria-live="assertive" aria-label="Puzzle completed">
      <h2>Well done!</h2>
      <p id="celebration-message">You made two valid grids.</p>

        <div id="share-panel">
        <h3>Tell all my friends!</h3>
      <p>Share your result, or copy it to paste into a message or social post.</p>

    <textarea
      id="share-text"
      readonly
      aria-label="Your FlipX result text"
    ></textarea>

    <div class="share-actions">
      <button id="share-result" type="button">Share</button>
      <button id="copy-result" type="button">Copy result</button>
    </div>

    <p id="copy-status" role="status"></p>
  </div>
</section>

    <section id="boards" aria-label="Two FlipX puzzle boards">
      <article class="board-card">
        <h2 class="board-title">Grid A</h2>

        <div class="board-wrap">
          <div
            id="board-a"
            class="board"
            role="grid"
            aria-label="Grid A crossword board"
          ></div>
        </div>
      </article>

      <article class="board-card">
        <h2 class="board-title">Grid B</h2>

        <div class="board-wrap">
          <div
            id="board-b"
            class="board"
            role="grid"
            aria-label="Grid B crossword board"
          ></div>
        </div>
      </article>
    </section>
  </main>

  <div id="animation-layer" aria-hidden="true"></div>

  <script src="./app.js"></script>
</body>
</html>
