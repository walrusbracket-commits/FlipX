<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlipX</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10151f;
      color: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.25rem;
      background: #10151f;
    }

    main {
      width: min(74rem, 100%);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2rem);
      border: 1px solid #35445a;
      border-radius: 1rem;
      background: #192230;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.75rem, 6vw, 2.4rem);
    }

    .subtitle {
      margin: 0 0 1.25rem;
      color: #aebed1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.9rem;
    }

    button {
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.55rem;
      cursor: pointer;
      background: #4c8dff;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: #75a7ff;
    }

    button:focus-visible {
      outline: 3px solid #79d9ba;
      outline-offset: 3px;
    }

    #move-count {
      margin: 0;
      padding: 0.55rem 0.75rem;
      border: 1px solid #40516a;
      border-radius: 0.55rem;
      background: #111924;
      color: #dce9f8;
      font-weight: 700;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0 0;
      color: #aebed1;
    }

    #boards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(1.25rem, 4vw, 3rem);
      margin-top: 1.5rem;
    }

    .board-card {
      flex: 1 1 28rem;
      max-width: 34rem;
      padding: 1.25rem;
      border: 1px solid #40516a;
      border-radius: 0.9rem;
      background: #111924;
    }

    .board-card:first-child {
      border-color: #6488b6;
    }

    .board-card:last-child {
      border-color: #b58936;
    }

    .board-title {
      margin: 0;
      text-align: center;
      color: #79d9ba;
      font-size: 1.2rem;
    }

    .board-wrap {
      display: grid;
      place-items: center;
      margin: 1.1rem 0 0.25rem;
      overflow-x: auto;
      padding: 0.25rem;
    }

    .board {
      --tile-size: clamp(1.9rem, 7vw, 3.35rem);
      display: grid;
      grid-template-columns: repeat(7, var(--tile-size));
      grid-template-rows: repeat(7, var(--tile-size));
      gap: 3px;
    }

    .tile {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid #4e627e;
      border-radius: 0.35rem;
      cursor: pointer;
      font: inherit;
      font-size: clamp(0.95rem, 4vw, 1.45rem);
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      transition: transform 120ms ease, filter 120ms ease;
      touch-action: manipulation;
    }

    .tile:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .tile:active {
      transform: translateY(1px) scale(0.97);
    }

    .tile:focus-visible {
      outline: 3px solid #79d9ba;
      outline-offset: 3px;
    }

    .tile--a {
      background: #d9e9ff;
      color: #10243d;
      border-color: #6488b6;
    }

    .tile--b {
      background: #ffe7ad;
      color: #3c2806;
      border-color: #b58936;
    }

    dialog {
      width: min(28rem, calc(100% - 2rem));
      padding: 0;
      border: 1px solid #5ad2a9;
      border-radius: 1rem;
      background: #14372c;
      color: #e4fff4;
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 55%);
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 64%);
    }

    .win-dialog-content {
      padding: 1.75rem;
      text-align: center;
    }

    .win-dialog-content h2 {
      margin: 0;
      font-size: 2rem;
    }

    .win-dialog-content p {
      margin: 0.8rem 0 1.4rem;
      color: #c8f7e4;
    }

    .win-dialog-content button {
      background: #54bc91;
      color: #092117;
    }

    .win-dialog-content button:hover {
      background: #79ddb3;
    }

    @media (max-width: 38rem) {
      body {
        padding: 0.7rem;
      }

      main {
        padding: 1rem;
      }

      .board-card {
        flex-basis: 100%;
        padding: 0.9rem;
      }

      .board {
        --tile-size: clamp(1.55rem, 10vw, 2.5rem);
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>FlipX</h1>
    <p class="subtitle">Make both grids into valid words.</p>

    <div class="controls">
      <button id="new-puzzle" type="button">New puzzle</button>
      <p id="move-count" aria-live="polite">Tiles moved: 0</p>
    </div>

    <p id="status" role="status">Loading puzzle data…</p>

    <section id="boards" aria-label="Two FlipX puzzle boards">
      <article class="board-card">
        <h2 class="board-title">Grid A</h2>

        <div class="board-wrap">
          <div
            id="board-a"
            class="board"
            role="grid"
            aria-label="Grid A crossword board"
          ></div>
        </div>
      </article>

      <article class="board-card">
        <h2 class="board-title">Grid B</h2>

        <div class="board-wrap">
          <div
            id="board-b"
            class="board"
            role="grid"
            aria-label="Grid B crossword board"
          ></div>
        </div>
      </article>
    </section>
  </main>

  <dialog id="win-dialog" aria-labelledby="win-title">
    <div class="win-dialog-content">
      <h2 id="win-title">Well done!</h2>
      <p id="win-message">You made two valid grids.</p>
      <button id="play-again" type="button" autofocus>Play another puzzle</button>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
